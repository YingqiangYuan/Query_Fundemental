[project]
name = "learn_sql_query_basic"
version = "0.1.1"
requires-python = ">=3.12,<4.0"
dependencies = [
    "polars>=1.40.1,<2.0.0",
    "SQLAlchemy>=2.0.33,<2.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["learn_sql_query_basic*"]
exclude = [
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
